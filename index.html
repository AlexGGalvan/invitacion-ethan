<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Invitación de cumpleaños de Ethan Mateo">
  <title>Invitación de Ethan Mateo</title>
  <style>
    :root {
      --blue: #1d7ed0;
      --deep-blue: #123d7c;
      --sky: #bdeeff;
      --red: #ee302f;
      --yellow: #ffd33f;
      --cream: #fff8dd;
      --teal: #19a7a5;
      --ink: #183052;
      --shadow: 0 24px 70px rgba(18, 61, 124, .28);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #c9f5ff;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif;
      background:
        radial-gradient(circle at 18% 15%, rgba(255, 211, 63, .9) 0 6px, transparent 7px),
        radial-gradient(circle at 78% 20%, rgba(238, 48, 47, .72) 0 9px, transparent 10px),
        radial-gradient(circle at 88% 80%, rgba(25, 167, 165, .6) 0 10px, transparent 11px),
        linear-gradient(135deg, #dffbff 0%, #fff9d6 52%, #ffdfe5 100%);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto auto 0 -8vw;
      width: 48vw;
      height: 48vw;
      max-width: 520px;
      max-height: 520px;
      background:
        radial-gradient(circle, rgba(255, 211, 63, .55) 0 18%, transparent 19%),
        repeating-conic-gradient(from 8deg, rgba(238, 48, 47, .2) 0 10deg, rgba(29, 126, 208, .16) 10deg 20deg);
      border-radius: 50%;
      filter: blur(.2px);
      opacity: .9;
      pointer-events: none;
    }

    body::after {
      inset: -14vw -10vw auto auto;
      background:
        radial-gradient(circle, rgba(25, 167, 165, .36) 0 20%, transparent 21%),
        repeating-conic-gradient(from -8deg, rgba(255, 211, 63, .22) 0 12deg, rgba(238, 48, 47, .14) 12deg 24deg);
    }

    main {
      position: relative;
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
    }

    .garland {
      position: fixed;
      top: 0;
      left: 50%;
      display: flex;
      gap: 12px;
      width: min(680px, 96vw);
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 0;
    }

    .garland span {
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 42px solid var(--red);
      filter: drop-shadow(0 5px 0 rgba(18, 61, 124, .12));
    }

    .garland span:nth-child(2n) {
      border-top-color: var(--yellow);
    }

    .garland span:nth-child(3n) {
      border-top-color: var(--teal);
    }

    .invitation {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 18px;
      justify-items: center;
      width: min(100%, 520px);
    }

    .book-toggle {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .book {
      position: relative;
      width: min(92vw, 430px, calc((100vh - 105px) * 9 / 14));
      min-width: min(92vw, 300px);
      aspect-ratio: 9 / 14;
      perspective: 1800px;
      filter: drop-shadow(var(--shadow));
    }

    .inside,
    .cover {
      position: absolute;
      inset: 0;
      border: 8px solid #fff;
      border-radius: 18px;
      overflow: hidden;
      backface-visibility: hidden;
    }

    .inside {
      z-index: 1;
      display: grid;
      align-items: stretch;
      background:
        radial-gradient(circle at 12% 83%, rgba(29, 126, 208, .85) 0 4px, transparent 5px),
        radial-gradient(circle at 84% 79%, rgba(238, 48, 47, .86) 0 4px, transparent 5px),
        radial-gradient(circle at 78% 91%, rgba(255, 211, 63, .9) 0 8px, transparent 9px),
        linear-gradient(90deg, rgba(18, 61, 124, .12), transparent 13%, transparent 87%, rgba(18, 61, 124, .1)),
        linear-gradient(180deg, #7fcdfb 0%, #72c4f3 30%, #fff 31%, #fff 100%);
      box-shadow: inset 0 0 0 2px rgba(255, 211, 63, .75);
    }

    .inside::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 2px dashed rgba(238, 48, 47, .5);
      border-radius: 12px;
      pointer-events: none;
    }

    .cover {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      align-items: center;
      gap: clamp(7px, 1.7vh, 12px);
      padding: clamp(14px, 3.8vw, 22px) clamp(15px, 4.6vw, 24px) clamp(17px, 4.8vw, 26px);
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform .95s cubic-bezier(.2, .8, .2, 1), filter .95s ease;
      cursor: pointer;
      z-index: 2;
      background:
        radial-gradient(circle at 16% 22%, rgba(255, 211, 63, .96) 0 7px, transparent 8px),
        radial-gradient(circle at 84% 18%, rgba(238, 48, 47, .84) 0 8px, transparent 9px),
        radial-gradient(circle at 12% 55%, rgba(255, 255, 255, .42) 0 10px, transparent 11px),
        radial-gradient(circle at 89% 52%, rgba(25, 167, 165, .7) 0 8px, transparent 9px),
        repeating-conic-gradient(from -8deg at 50% 42%, rgba(255, 255, 255, .42) 0 8deg, rgba(168, 230, 255, .2) 8deg 16deg),
        linear-gradient(180deg, #92ebff 0%, #45bdf3 40%, var(--blue) 70%, var(--deep-blue) 100%);
    }

    .cover::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 2px dashed rgba(255, 255, 255, .7);
      border-radius: 13px;
      background:
        linear-gradient(90deg, transparent 0 42%, rgba(255, 255, 255, .28) 42% 44%, transparent 44% 56%, rgba(255, 255, 255, .22) 56% 58%, transparent 58%),
        radial-gradient(circle at 50% 52%, rgba(255, 211, 63, .78) 0 28%, rgba(255, 255, 255, .84) 29% 34%, transparent 35%);
      pointer-events: none;
    }

    .cover::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 18px;
      background: linear-gradient(90deg, rgba(0, 0, 0, .28), rgba(255, 255, 255, .12), transparent);
      pointer-events: none;
    }

    .cover-scene {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .cover-curtain {
      position: absolute;
      top: -8px;
      width: 33%;
      height: 135px;
      border-bottom: 9px solid var(--yellow);
      background:
        repeating-linear-gradient(105deg, var(--red) 0 18px, #fff4d7 18px 34px, var(--red) 34px 52px);
      filter: drop-shadow(0 7px 0 rgba(18, 61, 124, .15));
    }

    .cover-curtain.left {
      left: -17px;
      border-radius: 0 0 86% 0;
      transform: rotate(-9deg);
    }

    .cover-curtain.right {
      right: -17px;
      border-radius: 0 0 0 86%;
      transform: rotate(9deg);
    }

    .cover-flags {
      position: absolute;
      top: 108px;
      left: 9%;
      right: 9%;
      display: flex;
      justify-content: space-between;
      filter: drop-shadow(0 4px 0 rgba(18, 61, 124, .14));
    }

    .cover-flags i {
      width: 0;
      height: 0;
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-top: 28px solid var(--yellow);
    }

    .cover-flags i:nth-child(2n) {
      border-top-color: var(--red);
    }

    .cover-flags i:nth-child(3n) {
      border-top-color: var(--teal);
    }

    .circus-tent {
      position: absolute;
      bottom: 58px;
      width: 122px;
      height: 122px;
      opacity: .98;
      filter: drop-shadow(0 10px 0 rgba(18, 61, 124, .14));
    }

    .circus-tent::before {
      content: "";
      position: absolute;
      left: 11px;
      right: 11px;
      top: 0;
      height: 72px;
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
      background: repeating-linear-gradient(100deg, #fff7dc 0 17px, var(--red) 17px 34px);
      border-bottom: 7px solid var(--yellow);
    }

    .circus-tent::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 58px;
      border-radius: 12px 12px 0 0;
      background:
        linear-gradient(90deg, var(--deep-blue) 0 16%, transparent 16% 84%, var(--deep-blue) 84%),
        repeating-linear-gradient(90deg, var(--red) 0 18px, #fff7dc 18px 36px);
      border-top: 6px solid var(--yellow);
    }

    .circus-tent.left {
      left: -29px;
      transform: rotate(-7deg) scale(.92);
    }

    .circus-tent.right {
      right: -29px;
      transform: rotate(7deg) scale(.92);
    }

    .cover-stage {
      position: absolute;
      left: 9%;
      right: 9%;
      bottom: 76px;
      height: 55px;
      border: 4px solid rgba(255, 255, 255, .82);
      border-radius: 50% 50% 10px 10px / 80% 80% 10px 10px;
      background:
        repeating-linear-gradient(90deg, var(--yellow) 0 27px, var(--red) 27px 54px, var(--blue) 54px 81px),
        linear-gradient(180deg, rgba(255, 255, 255, .58), transparent);
      opacity: .92;
    }

    .book-toggle:checked + .book .cover {
      transform: rotateY(-145deg);
      filter: brightness(.86);
    }

    .cover-character {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 0;
    }

    .cover-character img {
      width: min(105%, 330px);
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      transform: translateY(-68px) rotate(-4deg);
      filter: drop-shadow(0 18px 20px rgba(18, 61, 124, .26));
    }

    .cover-panel {
      position: relative;
      z-index: 3;
      display: grid;
      gap: 4px;
      justify-items: center;
      width: 100%;
      padding: 8px 14px 10px;
      color: #fff;
      text-align: center;
      border: 4px solid #fff;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(18, 61, 124, .96), rgba(29, 126, 208, .96));
      box-shadow: 0 8px 0 rgba(18, 61, 124, .18);
      text-shadow: 0 3px 0 rgba(18, 61, 124, .22);
    }

    .cover-title {
      position: relative;
      z-index: 3;
      display: grid;
      gap: 5px;
      justify-items: center;
      width: 100%;
      text-align: center;
    }

    .cover-invite {
      margin: 0;
      color: var(--deep-blue);
      font-size: clamp(.82rem, 3.1vw, 1.04rem);
      font-weight: 900;
      line-height: 1.05;
      text-transform: uppercase;
      text-shadow: 0 2px 0 rgba(255, 255, 255, .86);
    }

    .cover h1 {
      max-width: 100%;
      margin: 0;
      color: var(--red);
      font-size: clamp(2.05rem, 9.4vw, 3.2rem);
      line-height: .86;
      letter-spacing: 0;
      overflow-wrap: anywhere;
      text-shadow: 0 4px 0 #fff, 0 7px 0 rgba(255, 211, 63, .86), 0 11px 12px rgba(18, 61, 124, .18);
      -webkit-text-stroke: 1px #fff;
      paint-order: stroke fill;
    }

    .cover-moment {
      position: relative;
      z-index: 4;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      width: 100%;
      padding: 7px 23px;
      border: 3px solid #fff;
      border-radius: 18px;
      background: rgba(255, 255, 255, .84);
      box-shadow: 0 7px 0 rgba(18, 61, 124, .12);
    }

    .cover-moment::before,
    .cover-moment::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 8px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 0 4px rgba(238, 48, 47, .14);
      transform: translateY(-50%);
    }

    .cover-moment::before {
      left: 10px;
    }

    .cover-moment::after {
      right: 10px;
    }

    .cover-day,
    .cover-time {
      display: grid;
      justify-items: center;
      gap: 1px;
      line-height: 1;
      text-align: center;
    }

    .cover-day strong,
    .cover-time strong {
      color: var(--red);
      font-size: clamp(1.18rem, 5.4vw, 1.78rem);
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 2px 0 #fff, 0 4px 0 rgba(255, 211, 63, .52);
    }

    .cover-day span,
    .cover-time span {
      color: var(--deep-blue);
      font-size: clamp(.72rem, 2.7vw, .92rem);
      font-weight: 900;
      text-transform: uppercase;
    }

    .moment-divider {
      width: 2px;
      height: 42px;
      margin: 0 10px;
      border-radius: 999px;
      background-image: repeating-linear-gradient(to bottom, var(--deep-blue) 0 5px, transparent 5px 10px);
      opacity: .65;
    }

    .cover-party {
      position: relative;
      z-index: 3;
      display: grid;
      place-items: end center;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    .cover-age {
      position: absolute;
      right: clamp(0px, 2.2vw, 12px);
      bottom: clamp(33px, 6.4vh, 48px);
      z-index: 4;
      display: grid;
      justify-items: center;
      width: clamp(56px, 15.5vw, 76px);
      padding: 0;
      filter: drop-shadow(0 8px 0 rgba(18, 61, 124, .16)) drop-shadow(0 10px 14px rgba(18, 61, 124, .18));
      transform: rotate(5deg);
    }

    .cover-age picture {
      display: grid;
      place-items: center;
      width: 100%;
      aspect-ratio: 1 / 1.95;
      min-height: 0;
    }

    .cover-age img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 0 rgba(18, 61, 124, .12));
    }

    .cover-age span {
      position: absolute;
      left: 50%;
      bottom: -15px;
      padding: 3px 9px 4px;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 999px;
      background: var(--red);
      font-size: clamp(.72rem, 2.6vw, .84rem);
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 2px 0 rgba(18, 61, 124, .2);
      transform: translateX(-50%);
      box-shadow: 0 4px 0 rgba(18, 61, 124, .14);
    }

    .cover-note {
      color: #fff8c8;
      font-size: clamp(.95rem, 3.7vw, 1.15rem);
      font-weight: 900;
      text-transform: uppercase;
    }

    .spread {
      position: relative;
      display: grid;
      gap: clamp(4px, .75vh, 7px);
      align-content: start;
      justify-items: center;
      padding: clamp(12px, 3.2vw, 17px) clamp(15px, 4.6vw, 24px);
      text-align: center;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
    }

    .spread::before,
    .spread::after {
      content: "";
      position: absolute;
      width: 28px;
      aspect-ratio: 1;
      clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 56%, 79% 93%, 50% 71%, 21% 93%, 32% 56%, 2% 35%, 39% 35%);
      background: var(--yellow);
      opacity: .86;
      pointer-events: none;
      filter: drop-shadow(0 3px 0 rgba(18, 61, 124, .12));
    }

    .spread::before {
      left: 23px;
      top: 40px;
    }

    .spread::after {
      right: 25px;
      bottom: 28px;
    }

    .inside-hero {
      position: relative;
      display: grid;
      place-items: end center;
      width: 100%;
      min-height: clamp(116px, 20vh, 146px);
      overflow: hidden;
      border: 4px solid #fff;
      border-radius: 14px 14px 28px 28px;
      background:
        radial-gradient(circle at 12% 20%, #fff 0 4px, transparent 5px),
        radial-gradient(circle at 86% 24%, #fff 0 4px, transparent 5px),
        radial-gradient(circle at 82% 70%, rgba(255, 211, 63, .95) 0 10px, transparent 11px),
        repeating-conic-gradient(from -11deg at 50% 100%, rgba(255, 255, 255, .28) 0 9deg, rgba(29, 126, 208, .12) 9deg 18deg),
        linear-gradient(180deg, #5aaef0, #8bd8ff);
      box-shadow: 0 8px 0 rgba(18, 61, 124, .12);
    }

    .inside-hero::after {
      content: "";
      position: absolute;
      left: -8%;
      right: -8%;
      bottom: -16px;
      height: 52px;
      border-radius: 50% 50% 0 0;
      background: #fff;
    }

    .inside-flags {
      position: absolute;
      top: 0;
      left: -5%;
      right: -5%;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      padding-top: 3px;
      transform: rotate(-2deg);
      filter: drop-shadow(0 3px 0 rgba(18, 61, 124, .12));
    }

    .inside-flags i {
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 30px solid #fff;
    }

    .inside-flags i:nth-child(2n) {
      border-top-color: var(--yellow);
    }

    .inside-flags i:nth-child(3n) {
      border-top-color: var(--red);
    }

    .inside-flags i:nth-child(4n) {
      border-top-color: var(--blue);
    }

    .inside-party {
      position: relative;
      z-index: 3;
      display: grid;
      place-items: end center;
      width: 100%;
      height: 100%;
    }

    .inside-party img {
      width: min(72%, 218px);
      max-height: clamp(104px, 18vh, 134px);
      object-fit: contain;
      object-position: center bottom;
      transform: translateY(11px);
      filter: drop-shadow(0 13px 14px rgba(18, 61, 124, .23));
    }

    .inside-title {
      position: relative;
      z-index: 2;
      display: grid;
      justify-items: center;
      gap: 0;
      width: 100%;
      margin-top: -4px;
    }

    .inside-title h2 {
      margin: 0;
      color: var(--blue);
      font-size: clamp(1.72rem, 6.3vw, 2.6rem);
      line-height: .84;
      letter-spacing: 0;
      overflow-wrap: anywhere;
      white-space: nowrap;
      text-transform: uppercase;
      text-shadow: 0 3px 0 #fff, 0 6px 0 rgba(18, 61, 124, .12);
    }

    .birthday-line {
      margin: 0;
      color: #1b1b1b;
      font-size: clamp(.94rem, 3.2vw, 1.16rem);
      font-weight: 900;
      line-height: 1;
      text-transform: uppercase;
    }

    .birthday-line span {
      color: var(--red);
      font-size: 1.34em;
      text-shadow: 0 2px 0 var(--yellow);
    }

    .party-details {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      padding: 5px 0;
      border-top: 3px dotted var(--blue);
      border-bottom: 3px dotted var(--blue);
    }

    .party-detail {
      position: relative;
      display: grid;
      align-content: center;
      justify-items: center;
      min-height: 49px;
      padding: 3px 10px;
      line-height: 1.05;
      cursor: pointer;
      transition: transform .18s ease;
    }

    .party-detail + .party-detail {
      border-left: 3px dotted var(--red);
    }

    .party-detail::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 7px;
      width: 7px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--red);
      transform: translateY(-50%);
    }

    .party-detail.time::before {
      background: var(--yellow);
    }

    .party-detail:hover,
    .party-detail:focus-visible {
      transform: translateY(-2px);
      outline: none;
    }

    .party-detail strong {
      color: var(--blue);
      font-size: clamp(.98rem, 3.8vw, 1.3rem);
      font-weight: 900;
      text-transform: uppercase;
    }

    .party-detail span {
      color: #121212;
      font-size: clamp(.72rem, 2.5vw, .86rem);
      font-weight: 900;
      text-transform: uppercase;
    }

    .location-block {
      position: relative;
      z-index: 2;
      display: grid;
      gap: 4px;
      width: 100%;
      padding: 6px 8px 8px;
      border: 3px solid rgba(29, 126, 208, .22);
      border-radius: 14px;
      background: rgba(255, 255, 255, .78);
      box-shadow: 0 7px 0 rgba(18, 61, 124, .1);
    }

    .location-block h3 {
      margin: 0;
      color: #121212;
      font-size: clamp(.94rem, 3.4vw, 1.12rem);
      font-weight: 900;
      line-height: 1;
      text-transform: uppercase;
    }

    .location-block p {
      max-width: 34ch;
      margin: 0 auto;
      color: #315078;
      font-size: clamp(.7rem, 2.3vw, .8rem);
      font-weight: 800;
      line-height: 1.2;
    }

    .map-card {
      position: relative;
      width: 100%;
      min-height: 78px;
      overflow: hidden;
      border: 3px solid #fff;
      border-radius: 12px;
      background: #dff7ff;
      box-shadow: inset 0 0 0 2px rgba(29, 126, 208, .12);
    }

    .map-card iframe {
      display: block;
      width: 100%;
      height: clamp(78px, 11vh, 104px);
      border: 0;
    }

    .wait-copy {
      margin: 0;
      color: var(--blue);
      font-size: clamp(.94rem, 3.4vw, 1.12rem);
      font-weight: 900;
      line-height: 1;
      transform: rotate(-2deg);
    }

    .map-button,
    .open-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      min-height: 40px;
      padding: 9px 18px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      font: inherit;
      font-weight: 900;
      line-height: 1;
      text-decoration: none;
      background: linear-gradient(135deg, var(--red), #ff7a31);
      box-shadow: 0 8px 0 rgba(18, 61, 124, .18);
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .map-button:hover,
    .open-button:hover,
    .map-button:focus-visible,
    .open-button:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 10px 0 rgba(18, 61, 124, .16);
      outline: 3px solid rgba(255, 211, 63, .85);
      outline-offset: 3px;
    }

    .open-button {
      color: var(--deep-blue);
      background: linear-gradient(135deg, var(--yellow), #fff3a0);
    }

    .book-toggle:checked ~ .open-button {
      color: #fff;
      background: linear-gradient(135deg, var(--blue), var(--teal));
    }

    .book-toggle:not(:checked) ~ .open-button .close-copy,
    .book-toggle:checked ~ .open-button .open-copy {
      display: none;
    }

    .close-flap {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 5;
      width: 36%;
      opacity: 0;
      pointer-events: none;
      cursor: w-resize;
    }

    .close-flap::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 10px;
      width: 18px;
      height: 58px;
      border: 3px solid rgba(255, 255, 255, .85);
      border-radius: 999px;
      background: linear-gradient(180deg, var(--blue), var(--teal));
      box-shadow: 0 6px 0 rgba(18, 61, 124, .15);
      transform: translateY(-50%);
    }

    .close-flap::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 19px;
      width: 9px;
      height: 9px;
      border-bottom: 3px solid #fff;
      border-left: 3px solid #fff;
      transform: translateY(-50%) rotate(45deg);
    }

    .book-toggle:checked + .book .close-flap {
      opacity: 1;
      pointer-events: auto;
    }

    .sparkles {
      position: absolute;
      inset: -16px;
      pointer-events: none;
      z-index: 3;
    }

    .sparkles i {
      position: absolute;
      width: 12px;
      aspect-ratio: 1;
      transform: rotate(45deg);
      background: var(--yellow);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, .52);
    }

    .sparkles i:nth-child(1) {
      top: 8%;
      left: -2%;
      background: var(--red);
    }

    .sparkles i:nth-child(2) {
      top: 18%;
      right: -3%;
      background: var(--teal);
    }

    .sparkles i:nth-child(3) {
      right: 5%;
      bottom: 7%;
    }

    .sparkles i:nth-child(4) {
      bottom: 14%;
      left: 4%;
      background: var(--blue);
    }

    .celebration-burst {
      position: absolute;
      inset: -72px -48px -28px;
      z-index: 8;
      overflow: visible;
      pointer-events: none;
    }

    .celebration-burst span {
      position: absolute;
      opacity: 0;
      will-change: transform, opacity;
    }

    .balloon {
      bottom: 20%;
      width: 32px;
      height: 40px;
      border-radius: 54% 54% 48% 48%;
      background:
        radial-gradient(circle at 31% 24%, rgba(255, 255, 255, .88) 0 5px, transparent 6px),
        var(--balloon-color, var(--red));
      box-shadow: inset -6px -8px 0 rgba(18, 61, 124, .14), 0 6px 0 rgba(18, 61, 124, .08);
    }

    .balloon::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -7px;
      width: 0;
      height: 0;
      border-right: 5px solid transparent;
      border-left: 5px solid transparent;
      border-top: 8px solid var(--balloon-color, var(--red));
      transform: translateX(-50%);
    }

    .balloon::after {
      content: "";
      position: absolute;
      top: 94%;
      left: 50%;
      width: 2px;
      height: 50px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .88);
      transform: translateX(-50%);
    }

    .balloon.b1 {
      left: 5%;
      --balloon-color: var(--red);
      --x: -22px;
      --y: -188px;
      --r: -14deg;
      animation-delay: .08s;
    }

    .balloon.b2 {
      left: 47%;
      --balloon-color: var(--yellow);
      --x: 4px;
      --y: -218px;
      --r: 8deg;
      animation-delay: .18s;
    }

    .balloon.b3 {
      right: 4%;
      --balloon-color: #24c4ff;
      --x: 27px;
      --y: -194px;
      --r: 15deg;
      animation-delay: .28s;
    }

    .confetti {
      bottom: 33%;
      left: 50%;
      width: 8px;
      height: 14px;
      border-radius: 2px;
      background: var(--confetti-color, var(--yellow));
    }

    .confetti.c1 { --confetti-color: var(--red); --x: -168px; --y: -96px; --r: 160deg; animation-delay: .03s; }
    .confetti.c2 { --confetti-color: var(--yellow); --x: -116px; --y: -150px; --r: 230deg; animation-delay: .13s; }
    .confetti.c3 { --confetti-color: var(--teal); --x: -42px; --y: -180px; --r: 180deg; animation-delay: .08s; }
    .confetti.c4 { --confetti-color: var(--blue); --x: 52px; --y: -176px; --r: 290deg; animation-delay: .17s; }
    .confetti.c5 { --confetti-color: var(--red); --x: 126px; --y: -137px; --r: 210deg; animation-delay: .07s; }
    .confetti.c6 { --confetti-color: var(--yellow); --x: 170px; --y: -76px; --r: 330deg; animation-delay: .2s; }
    .confetti.c7 { --confetti-color: #ff7a31; --x: -134px; --y: 6px; --r: 260deg; animation-delay: .15s; }
    .confetti.c8 { --confetti-color: #24c4ff; --x: 142px; --y: 14px; --r: 190deg; animation-delay: .11s; }

    .book-toggle:checked + .book .balloon {
      animation-name: balloon-rise;
      animation-duration: 2.45s;
      animation-timing-function: cubic-bezier(.16, .8, .22, 1);
      animation-fill-mode: both;
    }

    .book-toggle:checked + .book .confetti {
      animation-name: confetti-pop;
      animation-duration: 1.35s;
      animation-timing-function: cubic-bezier(.14, .72, .28, 1);
      animation-fill-mode: both;
    }

    @keyframes balloon-rise {
      0% {
        opacity: 0;
        transform: translateY(80px) scale(.56) rotate(0deg);
      }
      12% {
        opacity: 1;
      }
      74% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(var(--x), var(--y)) scale(1) rotate(var(--r));
      }
    }

    @keyframes confetti-pop {
      0% {
        opacity: 0;
        transform: translate(0, 34px) scale(.7) rotate(0deg);
      }
      18% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(var(--x), var(--y)) scale(1) rotate(var(--r));
      }
    }

    @media (max-width: 390px) {
      main {
        padding: 18px 10px;
      }

      .inside,
      .cover {
        border-width: 6px;
        border-radius: 15px;
      }

      .cover-panel {
        padding: 8px 12px 10px;
      }

      .cover-moment {
        padding-inline: 9px;
      }

      .moment-divider {
        margin-inline: 7px;
      }

      .cover-age {
        width: 54px;
      }

      .spread {
        gap: 7px;
        padding: 17px 15px;
      }

      .inside-hero {
        min-height: 116px;
      }

      .inside-party img {
        width: min(76%, 205px);
        max-height: 110px;
      }

      .party-detail {
        min-height: 48px;
        padding-inline: 8px;
      }

      .location-block {
        padding: 7px 7px 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cover,
      .map-button,
      .open-button,
      .party-detail {
        transition: none;
      }

      .book-toggle:checked + .book .cover {
        opacity: 0;
        transform: none;
      }

      .celebration-burst span {
        animation: none !important;
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="garland" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <main>
    <section class="invitation" aria-label="Invitación de cumpleaños de Ethan Mateo">
      <input class="book-toggle" type="checkbox" id="open-book">

      <div class="book">
        <div class="inside" aria-live="polite">
          <div class="spread">
            <div class="inside-hero" aria-hidden="true">
              <span class="inside-flags"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
              <picture class="inside-party">
                <source srcset="assets/plim-plim-cover-cutout.webp" type="image/webp">
                <img src="assets/plim-plim-cover-cutout.png" alt="">
              </picture>
            </div>

            <div class="inside-title">
              <h2>Ethan Mateo</h2>
              <p class="birthday-line">cumple <span>1</span> añito</p>
            </div>

            <div class="party-details" aria-label="Fecha y hora del cumpleaños">
              <div class="party-detail date" tabindex="0">
                <strong>Sábado 26</strong>
                <span>de septiembre</span>
              </div>
              <div class="party-detail time" tabindex="0">
                <strong>3:30 PM</strong>
                <span>nos vemos</span>
              </div>
            </div>

            <div class="location-block">
              <h3>Dirección de la fiesta</h3>
              <p>Calle Fierro 970, esquina con Treviño.</p>
              <div class="map-card">
                <iframe
                  title="Mapa de Calle Fierro 970 esquina con Treviño"
                  src="https://maps.google.com/maps?q=25.521200177503733,-103.23749922460749&amp;z=17&amp;hl=es&amp;output=embed"
                  loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"
                  allowfullscreen>
                </iframe>
              </div>
            </div>
            <a class="map-button" href="https://www.google.com/maps/search/?api=1&query=25.521200177503733%2C-103.23749922460749" target="_blank" rel="noopener">Ver ubicación</a>
            <p class="wait-copy">¡Te esperamos!</p>
          </div>
        </div>

        <label class="cover" for="open-book" aria-label="Abrir invitación">
          <div class="cover-scene" aria-hidden="true">
            <span class="cover-curtain left"></span>
            <span class="cover-curtain right"></span>
            <span class="cover-flags"><i></i><i></i><i></i><i></i><i></i><i></i></span>
            <span class="circus-tent left"></span>
            <span class="circus-tent right"></span>
            <span class="cover-stage"></span>
          </div>
          <div class="cover-title">
            <p class="cover-invite">¡Acompáñame y celebremos!</p>
            <h1>Ethan Mateo</h1>
          </div>
          <div class="cover-moment" aria-label="Sábado 26 de septiembre a las 3:30 de la tarde">
            <span class="cover-day"><strong>26</strong><span>septiembre</span></span>
            <span class="moment-divider" aria-hidden="true"></span>
            <span class="cover-time"><strong>3:30 PM</strong><span>Sábado</span></span>
          </div>
          <div class="cover-party">
            <picture class="cover-character">
              <source srcset="assets/plim-plim-party.webp" type="image/webp">
              <img src="assets/plim-plim-party.png" alt="Plim Plim celebrando">
            </picture>
            <div class="cover-age" aria-label="1 añito">
              <picture>
                <source srcset="assets/number-one-sticker.webp" type="image/webp">
                <img src="assets/number-one-sticker.png" alt="1">
              </picture>
              <span>añito</span>
            </div>
          </div>
          <div class="cover-panel">
            <div class="cover-note">¡No faltes!</div>
          </div>
        </label>
        <label class="close-flap" for="open-book" aria-label="Cerrar invitación desde el lado izquierdo"></label>

        <div class="sparkles" aria-hidden="true">
          <i></i><i></i><i></i><i></i>
        </div>
        <div class="celebration-burst" aria-hidden="true">
          <span class="balloon b1"></span>
          <span class="balloon b2"></span>
          <span class="balloon b3"></span>
          <span class="confetti c1"></span>
          <span class="confetti c2"></span>
          <span class="confetti c3"></span>
          <span class="confetti c4"></span>
          <span class="confetti c5"></span>
          <span class="confetti c6"></span>
          <span class="confetti c7"></span>
          <span class="confetti c8"></span>
        </div>
      </div>

      <label class="open-button" for="open-book">
        <span class="open-copy">Abrir invitación</span>
        <span class="close-copy">Cerrar invitación</span>
      </label>
    </section>
  </main>
</body>
</html>
