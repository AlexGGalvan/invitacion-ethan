  <link rel="image_src" href="https://alexggalvan.github.io/invitacion-ethan/assets/og-ethan-mateo-plim-clean.png">
  <title>Invitación de Ethan Mateo</title>
  <style>
    :root {
      --blue: #1d7ed0;
      --deep-blue: #123d7c;
      --sky: #bdeeff;
      --red: #ee302f;
      --yellow: #ffd33f;
      --cream: #fff8dd;
      --teal: #19a7a5;
      --ink: #183052;
      --shadow: 0 24px 70px rgba(18, 61, 124, .28);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #c9f5ff;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif;
      background:
        radial-gradient(circle at 18% 15%, rgba(255, 211, 63, .9) 0 6px, transparent 7px),
        radial-gradient(circle at 78% 20%, rgba(238, 48, 47, .72) 0 9px, transparent 10px),
        radial-gradient(circle at 88% 80%, rgba(25, 167, 165, .6) 0 10px, transparent 11px),
        linear-gradient(135deg, #dffbff 0%, #fff9d6 52%, #ffdfe5 100%);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto auto 0 -8vw;
      width: 48vw;
      height: 48vw;
      max-width: 520px;
      max-height: 520px;
      background:
        radial-gradient(circle, rgba(255, 211, 63, .55) 0 18%, transparent 19%),
        repeating-conic-gradient(from 8deg, rgba(238, 48, 47, .2) 0 10deg, rgba(29, 126, 208, .16) 10deg 20deg);
      border-radius: 50%;
      filter: blur(.2px);
      opacity: .9;
      pointer-events: none;
    }

    body::after {
      inset: -14vw -10vw auto auto;
      background:
        radial-gradient(circle, rgba(25, 167, 165, .36) 0 20%, transparent 21%),
        repeating-conic-gradient(from -8deg, rgba(255, 211, 63, .22) 0 12deg, rgba(238, 48, 47, .14) 12deg 24deg);
    }

    main {
      position: relative;
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
    }

    .garland {
      position: fixed;
      top: 0;
      left: 50%;
      display: flex;
      gap: 12px;
      width: min(680px, 96vw);
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 0;
    }

    .garland span {
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 42px solid var(--red);
      filter: drop-shadow(0 5px 0 rgba(18, 61, 124, .12));
    }

    .garland span:nth-child(2n) {
      border-top-color: var(--yellow);
    }

    .garland span:nth-child(3n) {
      border-top-color: var(--teal);
    }

    .invitation {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 18px;
      justify-items: center;
      width: min(100%, 520px);
    }

    .book-toggle {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .book {
      position: relative;
      width: min(92vw, 430px, calc((100vh - 105px) * 9 / 14));
      min-width: min(92vw, 300px);
      aspect-ratio: 9 / 14;
      perspective: 1800px;
      filter: drop-shadow(var(--shadow));
    }

    .inside,
    .cover {
      position: absolute;
      inset: 0;
      border: 8px solid #fff;
      border-radius: 18px;
      overflow: hidden;
      backface-visibility: hidden;
    }

    .inside {
      z-index: 1;
      display: grid;
      align-items: stretch;
      background:
        radial-gradient(circle at 12% 83%, rgba(29, 126, 208, .85) 0 4px, transparent 5px),
        radial-gradient(circle at 84% 79%, rgba(238, 48, 47, .86) 0 4px, transparent 5px),
        radial-gradient(circle at 78% 91%, rgba(255, 211, 63, .9) 0 8px, transparent 9px),
        linear-gradient(90deg, rgba(18, 61, 124, .12), transparent 13%, transparent 87%, rgba(18, 61, 124, .1)),
        linear-gradient(180deg, #7fcdfb 0%, #72c4f3 30%, #fff 31%, #fff 100%);
      box-shadow: inset 0 0 0 2px rgba(255, 211, 63, .75);
    }

    .inside::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 2px dashed rgba(238, 48, 47, .5);
      border-radius: 12px;
      pointer-events: none;
    }

    .cover {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      align-items: center;
      gap: clamp(7px, 1.7vh, 12px);
      padding: clamp(14px, 3.8vw, 22px) clamp(15px, 4.6vw, 24px) clamp(17px, 4.8vw, 26px);
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform .95s cubic-bezier(.2, .8, .2, 1), filter .95s ease;
      cursor: pointer;
      z-index: 2;
      background:
        radial-gradient(circle at 16% 22%, rgba(255, 211, 63, .96) 0 7px, transparent 8px),
        radial-gradient(circle at 84% 18%, rgba(238, 48, 47, .84) 0 8px, transparent 9px),
        radial-gradient(circle at 12% 55%, rgba(255, 255, 255, .42) 0 10px, transparent 11px),
        radial-gradient(circle at 89% 52%, rgba(25, 167, 165, .7) 0 8px, transparent 9px),
        repeating-conic-gradient(from -8deg at 50% 42%, rgba(255, 255, 255, .42) 0 8deg, rgba(168, 230, 255, .2) 8deg 16deg),
        linear-gradient(180deg, #92ebff 0%, #45bdf3 40%, var(--blue) 70%, var(--deep-blue) 100%);
    }

    .cover::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 2px dashed rgba(255, 255, 255, .7);
      border-radius: 13px;
      background:
        linear-gradient(90deg, transparent 0 42%, rgba(255, 255, 255, .28) 42% 44%, transparent 44% 56%, rgba(255, 255, 255, .22) 56% 58%, transparent 58%),
        radial-gradient(circle at 50% 52%, rgba(255, 211, 63, .78) 0 28%, rgba(255, 255, 255, .84) 29% 34%, transparent 35%);
      pointer-events: none;
    }

    .cover::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 18px;
      background: linear-gradient(90deg, rgba(0, 0, 0, .28), rgba(255, 255, 255, .12), transparent);
      pointer-events: none;
    }

    .cover-scene {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .cover-curtain {
      position: absolute;
      top: -8px;
      width: 33%;
      height: 135px;
      border-bottom: 9px solid var(--yellow);
      background:
        repeating-linear-gradient(105deg, var(--red) 0 18px, #fff4d7 18px 34px, var(--red) 34px 52px);
      filter: drop-shadow(0 7px 0 rgba(18, 61, 124, .15));
    }

    .cover-curtain.left {
      left: -17px;
      border-radius: 0 0 86% 0;
      transform: rotate(-9deg);
    }

    .cover-curtain.right {
      right: -17px;
      border-radius: 0 0 0 86%;
      transform: rotate(9deg);
    }

    .cover-flags {
      position: absolute;
      top: 108px;
      left: 9%;
      right: 9%;
      display: flex;
      justify-content: space-between;
      filter: drop-shadow(0 4px 0 rgba(18, 61, 124, .14));
    }

    .cover-flags i {
      width: 0;
      height: 0;
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-top: 28px solid var(--yellow);
    }

    .cover-flags i:nth-child(2n) {
      border-top-color: var(--red);
    }

    .cover-flags i:nth-child(3n) {
      border-top-color: var(--teal);
    }

    .circus-tent {
      position: absolute;
      bottom: 58px;
      width: 122px;
      height: 122px;
      opacity: .98;
      filter: drop-shadow(0 10px 0 rgba(18, 61, 124, .14));
    }

    .circus-tent::before {
      content: "";
      position: absolute;
      left: 11px;
      right: 11px;
      top: 0;
      height: 72px;
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
      background: repeating-linear-gradient(100deg, #fff7dc 0 17px, var(--red) 17px 34px);
      border-bottom: 7px solid var(--yellow);
    }

    .circus-tent::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 58px;
      border-radius: 12px 12px 0 0;
      background:
        linear-gradient(90deg, var(--deep-blue) 0 16%, transparent 16% 84%, var(--deep-blue) 84%),
        repeating-linear-gradient(90deg, var(--red) 0 18px, #fff7dc 18px 36px);
      border-top: 6px solid var(--yellow);
    }

    .circus-tent.left {
      left: -29px;
      transform: rotate(-7deg) scale(.92);
    }

    .circus-tent.right {
      right: -29px;
      transform: rotate(7deg) scale(.92);
    }

    .cover-stage {
      position: absolute;
      left: 9%;
      right: 9%;
      bottom: 76px;
      height: 55px;
      border: 4px solid rgba(255, 255, 255, .82);
      border-radius: 50% 50% 10px 10px / 80% 80% 10px 10px;
      background:
        repeating-linear-gradient(90deg, var(--yellow) 0 27px, var(--red) 27px 54px, var(--blue) 54px 81px),
        linear-gradient(180deg, rgba(255, 255, 255, .58), transparent);
      opacity: .92;
    }

    .book-toggle:checked + .book .cover {
      transform: rotateY(-145deg);
      filter: brightness(.86);
    }

    .cover-character {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 0;
    }

    .cover-character img {
      width: min(70%, 232px);
      height: auto;
      max-height: 86%;
      object-fit: contain;
      object-position: center bottom;
      transform: translateY(-8px) rotate(-4deg);
      filter: drop-shadow(0 18px 20px rgba(18, 61, 124, .26));
    }

    .cover-panel {
      position: relative;
      z-index: 3;
      display: grid;
      gap: 6px;
      justify-items: center;
      width: 100%;
      padding: 8px 12px 11px;
      color: #fff;
      text-align: center;
      border: 4px solid #fff;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(18, 61, 124, .96), rgba(29, 126, 208, .96));
      box-shadow: 0 8px 0 rgba(18, 61, 124, .18);
      text-shadow: 0 3px 0 rgba(18, 61, 124, .22);
    }

    .cover-title {
      position: relative;
      z-index: 3;
      display: grid;
      gap: 5px;
      justify-items: center;
      width: 100%;
      text-align: center;
    }

    .cover-invite {
      margin: 0;
      color: var(--deep-blue);
      font-size: clamp(.82rem, 3.1vw, 1.04rem);
      font-weight: 900;
      line-height: 1.05;
      text-transform: uppercase;
      text-shadow: 0 2px 0 rgba(255, 255, 255, .86);
    }

    .cover h1 {
      max-width: 100%;
      margin: 0;
      color: var(--red);
      font-size: clamp(2.05rem, 9.4vw, 3.2rem);
      line-height: .86;
      letter-spacing: 0;
      overflow-wrap: anywhere;
      text-shadow: 0 4px 0 #fff, 0 7px 0 rgba(255, 211, 63, .86), 0 11px 12px rgba(18, 61, 124, .18);
      -webkit-text-stroke: 1px #fff;
      paint-order: stroke fill;
    }

    .cover-moment {
      position: relative;
      z-index: 4;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      width: 100%;
      padding: 7px 23px;
      border: 3px solid #fff;
      border-radius: 18px;
      background: rgba(255, 255, 255, .84);
      box-shadow: 0 7px 0 rgba(18, 61, 124, .12);
    }

    .cover-moment::before,
    .cover-moment::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 8px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 0 4px rgba(238, 48, 47, .14);
      transform: translateY(-50%);
    }

    .cover-moment::before {
      left: 10px;
    }

    .cover-moment::after {
      right: 10px;
    }

    .cover-day,
    .cover-time {
      display: grid;
      justify-items: center;
      gap: 1px;
      line-height: 1;
      text-align: center;
    }

    .cover-day strong,
    .cover-time strong {
      color: var(--red);
      font-size: clamp(1.18rem, 5.4vw, 1.78rem);
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 2px 0 #fff, 0 4px 0 rgba(255, 211, 63, .52);
    }

    .cover-day span,
    .cover-time span {
      color: var(--deep-blue);
      font-size: clamp(.72rem, 2.7vw, .92rem);
      font-weight: 900;
      text-transform: uppercase;
    }

    .moment-divider {
      width: 2px;
      height: 42px;
      margin: 0 10px;
      border-radius: 999px;
      background-image: repeating-linear-gradient(to bottom, var(--deep-blue) 0 5px, transparent 5px 10px);
      opacity: .65;
    }

    .cover-party {
      position: relative;
      z-index: 3;
      display: grid;
      place-items: end center;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    .cover-punctual {
      position: absolute;
      top: 0;
      left: 50%;
      z-index: 5;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      max-width: 92%;
      padding: 7px 15px 8px;
      color: #fff;
      border: 3px solid #fff;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--red), #ff7a31);
      box-shadow: 0 7px 0 rgba(18, 61, 124, .16);
      font-size: clamp(.82rem, 3.1vw, 1.03rem);
      font-weight: 900;
      line-height: 1;
      text-align: center;
      text-shadow: 0 2px 0 rgba(18, 61, 124, .2);
      text-transform: uppercase;
      white-space: nowrap;
      transform: translateX(-50%) rotate(-2deg);
    }

    .cover-age {
      position: absolute;
      right: clamp(0px, 2.2vw, 12px);
      bottom: clamp(33px, 6.4vh, 48px);
      z-index: 4;
      display: grid;
      justify-items: center;
      width: clamp(56px, 15.5vw, 76px);
      padding: 0;
      filter: drop-shadow(0 8px 0 rgba(18, 61, 124, .16)) drop-shadow(0 10px 14px rgba(18, 61, 124, .18));
      transform: rotate(5deg);
    }

    .cover-age picture {
      display: grid;
      place-items: center;
      width: 100%;
      aspect-ratio: 1 / 1.95;
      min-height: 0;
    }

    .cover-age img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 0 rgba(18, 61, 124, .12));
    }

    .cover-age span {
      position: absolute;
      left: 50%;
      bottom: -15px;
      padding: 3px 9px 4px;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 999px;
      background: var(--red);
      font-size: clamp(.72rem, 2.6vw, .84rem);
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 2px 0 rgba(18, 61, 124, .2);
      transform: translateX(-50%);
      box-shadow: 0 4px 0 rgba(18, 61, 124, .14);
    }

    .cover-note {
      color: #fff8c8;
      font-size: clamp(.95rem, 3.7vw, 1.15rem);
      font-weight: 900;
      text-transform: uppercase;
    }

    .cover-reminder {
      max-width: 100%;
      padding: 5px 10px 6px;
      color: var(--deep-blue);
      border: 2px solid rgba(255, 255, 255, .9);
      border-radius: 999px;
      background: linear-gradient(135deg, var(--yellow), #fff6b8);
      box-shadow: 0 4px 0 rgba(18, 61, 124, .13);
      font-size: clamp(.68rem, 2.65vw, .84rem);
      font-weight: 900;
      line-height: 1.05;
      text-shadow: none;
      text-transform: uppercase;
    }

    .spread {
      position: relative;
      display: grid;
      gap: clamp(4px, .75vh, 7px);
      align-content: start;
      justify-items: center;
      padding: clamp(12px, 3.2vw, 17px) clamp(15px, 4.6vw, 24px);
      text-align: center;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
    }

    .spread::before,
    .spread::after {
      content: "";
      position: absolute;
      width: 28px;
      aspect-ratio: 1;
      clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 56%, 79% 93%, 50% 71%, 21% 93%, 32% 56%, 2% 35%, 39% 35%);
      background: var(--yellow);
      opacity: .86;
      pointer-events: none;
      filter: drop-shadow(0 3px 0 rgba(18, 61, 124, .12));
    }

    .spread::before {
      left: 23px;
      top: 40px;
    }

    .spread::after {
      right: 25px;
      bottom: 28px;
    }

    .inside-hero {
      position: relative;
      display: grid;
      place-items: end center;
      width: 100%;
      min-height: clamp(116px, 20vh, 146px);
      overflow: hidden;
      border: 4px solid #fff;
      border-radius: 14px 14px 28px 28px;
      background:
        radial-gradient(circle at 12% 20%, #fff 0 4px, transparent 5px),
        radial-gradient(circle at 86% 24%, #fff 0 4px, transparent 5px),
        radial-gradient(circle at 82% 70%, rgba(255, 211, 63, .95) 0 10px, transparent 11px),
        repeating-conic-gradient(from -11deg at 50% 100%, rgba(255, 255, 255, .28) 0 9deg, rgba(29, 126, 208, .12) 9deg 18deg),
        linear-gradient(180deg, #5aaef0, #8bd8ff);
      box-shadow: 0 8px 0 rgba(18, 61, 124, .12);
    }

    .inside-hero::after {
      content: "";
      position: absolute;
      left: -8%;
      right: -8%;
      bottom: -16px;
      height: 52px;
      border-radius: 50% 50% 0 0;
      background: #fff;
    }

    .inside-flags {
      position: absolute;
      top: 0;
      left: -5%;
      right: -5%;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      padding-top: 3px;
      transform: rotate(-2deg);
      filter: drop-shadow(0 3px 0 rgba(18, 61, 124, .12));
    }

    .inside-flags i {
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 30px solid #fff;
    }

    .inside-flags i:nth-child(2n) {
      border-top-color: var(--yellow);
    }

    .inside-flags i:nth-child(3n) {
      border-top-color: var(--red);
    }

    .inside-flags i:nth-child(4n) {
      border-top-color: var(--blue);
    }

    .inside-party {
      position: relative;
      z-index: 3;
      display: grid;
      place-items: end center;
      width: 100%;
      height: 100%;
    }

    .inside-party img {
      width: min(72%, 218px);
      max-height: clamp(104px, 18vh, 134px);
      object-fit: contain;
      object-position: center bottom;
      transform: translateY(11px);
      filter: drop-shadow(0 13px 14px rgba(18, 61, 124, .23));
    }

    .inside-title {
      position: relative;
      z-index: 2;
      display: grid;
      justify-items: center;
      gap: 0;
      width: 100%;
      margin-top: -4px;
    }

    .inside-title h2 {
      margin: 0;
      color: var(--blue);
      font-size: clamp(1.72rem, 6.3vw, 2.6rem);
      line-height: .84;
      letter-spacing: 0;
      overflow-wrap: anywhere;
      white-space: nowrap;
      text-transform: uppercase;
      text-shadow: 0 3px 0 #fff, 0 6px 0 rgba(18, 61, 124, .12);
    }

    .birthday-line {
      margin: 0;
      color: #1b1b1b;
      font-size: clamp(.94rem, 3.2vw, 1.16rem);
      font-weight: 900;
      line-height: 1;
      text-transform: uppercase;
    }

    .birthday-line span {
      color: var(--red);
      font-size: 1.34em;
      text-shadow: 0 2px 0 var(--yellow);
    }

    .party-details {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      padding: 5px 0;
      border-top: 3px dotted var(--blue);
      border-bottom: 3px dotted var(--blue);
    }

    .party-detail {
      position: relative;
      display: grid;
      align-content: center;
      justify-items: center;
      min-height: 49px;
      padding: 3px 10px;
      line-height: 1.05;
      cursor: pointer;
      transition: transform .18s ease;
    }

    .party-detail + .party-detail {
      border-left: 3px dotted var(--red);
    }

    .party-detail::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 7px;
      width: 7px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--red);
      transform: translateY(-50%);
    }

    .party-detail.time::before {
      background: var(--yellow);
    }

    .party-detail:hover,
    .party-detail:focus-visible {

    .show-decor {

      height: 52px;

    .show-decor::before {

    .show-decor::after {

      width: 16px;

    .show-decor.right::after {

    .show-decor i {
      position: absolute;
      width: 7px;
      height: 10px;
      border-radius: 2px;

    .show-decor i:nth-child(1) {
      left: 3px;
      bottom: 8px;

      --r: -22deg;
    }

    .show-decor i:nth-child(2) {
      left: 22px;
      bottom: 2px;
      --confetti-color: var(--red);

    .show-decor i:nth-child(3) {

    .location-block {
      position: relative;
      z-index: 2;

      gap: 4px;

    .location-block h3 {

      font-weight: 900;
      line-height: 1;
      text-transform: uppercase;
    }

    .location-block p {

      margin: 0 auto;
      color: #315078;
      font-size: clamp(.7rem, 2.3vw, .8rem);
      font-weight: 800;
      line-height: 1.2;
    }

    .map-card {
      position: relative;
      width: 100%;
      min-height: 78px;
      overflow: hidden;
      border: 3px solid #fff;
      border-radius: 12px;
      background: #dff7ff;
      box-shadow: inset 0 0 0 2px rgba(29, 126, 208, .12);
    }

    .map-card iframe {
      display: block;
      width: 100%;
      height: clamp(78px, 11vh, 104px);
      border: 0;
    }

    .wait-copy {
      margin: 0;
      color: var(--blue);
      font-size: clamp(.94rem, 3.4vw, 1.12rem);
      font-weight: 900;
      line-height: 1;
      transform: rotate(-2deg);
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
    }

    .map-button,
    .rsvp-button,
    .rsvp-submit,
    .rsvp-close,
    .open-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 40px;
      padding: 9px 18px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      font: inherit;
      font-size: clamp(.72rem, 2.6vw, .92rem);
      font-weight: 900;
      line-height: 1;
      text-decoration: none;
      background: linear-gradient(135deg, var(--red), #ff7a31);
      box-shadow: 0 8px 0 rgba(18, 61, 124, .18);
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .map-button:hover,
    .rsvp-button:hover,
    .rsvp-submit:hover,
    .rsvp-close:hover,
    .open-button:hover,
    .map-button:focus-visible,
    .rsvp-button:focus-visible,
    .rsvp-submit:focus-visible,
    .rsvp-close:focus-visible,
    .open-button:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 10px 0 rgba(18, 61, 124, .16);
      outline: 3px solid rgba(255, 211, 63, .85);
      outline-offset: 3px;
    }

    .rsvp-button {
      color: var(--deep-blue);
      background: linear-gradient(135deg, var(--yellow), #fff4a8);
    }

    .open-button {
      color: var(--deep-blue);
      background: linear-gradient(135deg, var(--yellow), #fff3a0);
    }

    .book-toggle:checked ~ .open-button {
      color: #fff;
      background: linear-gradient(135deg, var(--blue), var(--teal));
    }

    .rsvp-modal[hidden] {
      display: none;
    }

    .rsvp-modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(18, 48, 82, .54);
    }

    .rsvp-dialog {
      position: relative;
      display: grid;
      gap: 14px;
      width: min(92vw, 370px);
      padding: 22px;
      overflow: hidden;
      border: 6px solid #fff;
      border-radius: 20px;
      background:
        radial-gradient(circle at 12% 16%, rgba(255, 211, 63, .95) 0 9px, transparent 10px),
        radial-gradient(circle at 88% 18%, rgba(238, 48, 47, .82) 0 8px, transparent 9px),
        linear-gradient(180deg, #e6fbff, #fff 58%, #fff6be);
      box-shadow: 0 24px 70px rgba(18, 48, 82, .32);
      text-align: center;
    }

    .rsvp-dialog::before {
      content: "";
      position: absolute;
      top: -3px;
      left: -4%;
      right: -4%;
      height: 28px;
      background: repeating-linear-gradient(90deg, var(--red) 0 28px, var(--yellow) 28px 56px, var(--teal) 56px 84px, var(--blue) 84px 112px);
      clip-path: polygon(0 0, 100% 0, 100% 45%, 96% 100%, 92% 45%, 88% 100%, 84% 45%, 80% 100%, 76% 45%, 72% 100%, 68% 45%, 64% 100%, 60% 45%, 56% 100%, 52% 45%, 48% 100%, 44% 45%, 40% 100%, 36% 45%, 32% 100%, 28% 45%, 24% 100%, 20% 45%, 16% 100%, 12% 45%, 8% 100%, 4% 45%, 0 100%);
    }

    .rsvp-dialog h2 {
      margin: 10px 0 0;
      color: var(--red);
      font-size: clamp(1.45rem, 6vw, 2rem);
      line-height: .95;
      text-shadow: 0 3px 0 #fff, 0 6px 0 rgba(255, 211, 63, .6);
    }

    .rsvp-dialog p {
      margin: 0;
      color: #315078;
      font-size: .92rem;
      font-weight: 800;
      line-height: 1.25;
    }

    .guest-stepper {
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .guest-stepper button {
      display: grid;
      place-items: center;
      width: 48px;
      aspect-ratio: 1;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(135deg, var(--blue), var(--teal));
      box-shadow: 0 6px 0 rgba(18, 61, 124, .16);
      font: inherit;
      font-size: 1.55rem;
      font-weight: 900;
      cursor: pointer;
    }

    .guest-stepper input {
      width: 100%;
      min-width: 0;
      padding: 8px 10px;
      border: 4px solid var(--yellow);
      border-radius: 16px;
      color: var(--deep-blue);
      background: #fff;
      font: inherit;
      font-size: 2.25rem;
      font-weight: 900;
      line-height: 1;
      text-align: center;
      box-shadow: inset 0 0 0 2px rgba(29, 126, 208, .13);
    }

    .rsvp-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .rsvp-submit {
      background: linear-gradient(135deg, var(--red), #ff7a31);
    }

    .rsvp-close {
      color: var(--deep-blue);
      background: linear-gradient(135deg, #e8f8ff, #fff);
    }

    .rsvp-submit:disabled,
    .rsvp-close:disabled,
    .guest-stepper button:disabled,
    .guest-stepper input:disabled {
      cursor: not-allowed;
      opacity: .65;
    }

    .rsvp-status {
      min-height: 20px;
      color: var(--deep-blue);
      font-size: .8rem;
      font-weight: 900;
      line-height: 1.2;
    }

    .book-toggle:not(:checked) ~ .open-button .close-copy,
    .book-toggle:checked ~ .open-button .open-copy {
      display: none;
    }

    .close-flap {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 5;
      width: 36%;
      opacity: 0;
      pointer-events: none;
      cursor: w-resize;
    }

    .close-flap::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 10px;
      width: 18px;
      height: 58px;
      border: 3px solid rgba(255, 255, 255, .85);
      border-radius: 999px;
      background: linear-gradient(180deg, var(--blue), var(--teal));
      box-shadow: 0 6px 0 rgba(18, 61, 124, .15);
      transform: translateY(-50%);
    }

    .close-flap::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 19px;
      width: 9px;
      height: 9px;
      border-bottom: 3px solid #fff;
      border-left: 3px solid #fff;
      transform: translateY(-50%) rotate(45deg);
    }

    .book-toggle:checked + .book .close-flap {
      opacity: 1;
      pointer-events: auto;
    }

    .sparkles {
      position: absolute;
      inset: -16px;
      pointer-events: none;
      z-index: 3;
    }

    .sparkles i {
      position: absolute;
      width: 12px;
      aspect-ratio: 1;
      transform: rotate(45deg);
      background: var(--yellow);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, .52);
    }

    .sparkles i:nth-child(1) {
      top: 8%;
      left: -2%;
      background: var(--red);
    }

    .sparkles i:nth-child(2) {
      top: 18%;
      right: -3%;
      background: var(--teal);
    }

    .sparkles i:nth-child(3) {
      right: 5%;
      bottom: 7%;
    }

    .sparkles i:nth-child(4) {
      bottom: 14%;
      left: 4%;
      background: var(--blue);
    }

    .celebration-burst {
      position: absolute;
      inset: -72px -48px -28px;
      z-index: 8;
      overflow: visible;
      pointer-events: none;
    }

    .celebration-burst span {
      position: absolute;
      opacity: 0;
      will-change: transform, opacity;
    }

    .balloon {
      bottom: 20%;
      width: 32px;
      height: 40px;
      border-radius: 54% 54% 48% 48%;
      background:
        radial-gradient(circle at 31% 24%, rgba(255, 255, 255, .88) 0 5px, transparent 6px),
        var(--balloon-color, var(--red));
      box-shadow: inset -6px -8px 0 rgba(18, 61, 124, .14), 0 6px 0 rgba(18, 61, 124, .08);
    }

    .balloon::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -7px;
      width: 0;
      height: 0;
      border-right: 5px solid transparent;
      border-left: 5px solid transparent;
      border-top: 8px solid var(--balloon-color, var(--red));
      transform: translateX(-50%);
    }

    .balloon::after {
      content: "";
      position: absolute;
      top: 94%;
      left: 50%;
      width: 2px;
      height: 50px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .88);
      transform: translateX(-50%);
    }

    .balloon.b1 {
      left: 5%;
      --balloon-color: var(--red);
      --x: -22px;
      --y: -188px;
      --r: -14deg;
      animation-delay: .08s;
    }

    .balloon.b2 {
      left: 47%;
      --balloon-color: var(--yellow);
      --x: 4px;
      --y: -218px;
      --r: 8deg;
      animation-delay: .18s;
    }

    .balloon.b3 {
      right: 4%;
      --balloon-color: #24c4ff;
      --x: 27px;
      --y: -194px;
      --r: 15deg;
      animation-delay: .28s;
    }

    .confetti {
      bottom: 33%;
      left: 50%;
      width: 8px;
      height: 14px;
      border-radius: 2px;
      background: var(--confetti-color, var(--yellow));
    }

    .confetti.c1 { --confetti-color: var(--red); --x: -168px; --y: -96px; --r: 160deg; animation-delay: .03s; }
    .confetti.c2 { --confetti-color: var(--yellow); --x: -116px; --y: -150px; --r: 230deg; animation-delay: .13s; }
    .confetti.c3 { --confetti-color: var(--teal); --x: -42px; --y: -180px; --r: 180deg; animation-delay: .08s; }
    .confetti.c4 { --confetti-color: var(--blue); --x: 52px; --y: -176px; --r: 290deg; animation-delay: .17s; }
    .confetti.c5 { --confetti-color: var(--red); --x: 126px; --y: -137px; --r: 210deg; animation-delay: .07s; }
    .confetti.c6 { --confetti-color: var(--yellow); --x: 170px; --y: -76px; --r: 330deg; animation-delay: .2s; }
    .confetti.c7 { --confetti-color: #ff7a31; --x: -134px; --y: 6px; --r: 260deg; animation-delay: .15s; }
    .confetti.c8 { --confetti-color: #24c4ff; --x: 142px; --y: 14px; --r: 190deg; animation-delay: .11s; }

    .book-toggle:checked + .book .balloon {
      animation-name: balloon-rise;
      animation-duration: 2.45s;
      animation-timing-function: cubic-bezier(.16, .8, .22, 1);
      animation-fill-mode: both;
    }

    .book-toggle:checked + .book .confetti {
      animation-name: confetti-pop;
      animation-duration: 1.35s;
      animation-timing-function: cubic-bezier(.14, .72, .28, 1);
      animation-fill-mode: both;
    }

    @keyframes balloon-rise {
      0% {
        opacity: 0;
        transform: translateY(80px) scale(.56) rotate(0deg);
      }
      12% {
        opacity: 1;
      }
      74% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(var(--x), var(--y)) scale(1) rotate(var(--r));
      }
    }

    @keyframes confetti-pop {
      0% {
        opacity: 0;
        transform: translate(0, 34px) scale(.7) rotate(0deg);
      }
      18% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(var(--x), var(--y)) scale(1) rotate(var(--r));
      }
    }

    @media (max-width: 390px) {
      main {
        padding: 18px 10px;
      }

      .inside,
      .cover {
        border-width: 6px;
        border-radius: 15px;
      }

      .cover-panel {
        padding: 8px 12px 10px;
      }

      .cover-moment {
        padding-inline: 9px;
      }

      .moment-divider {
        margin-inline: 7px;
      }

      .cover-age {
        width: 54px;
      }

      .cover-punctual {
        padding-inline: 12px;
      }

      .cover-reminder {
        padding-inline: 8px;
        font-size: .66rem;
      }

      .spread {
        gap: 7px;
        padding: 17px 15px;
      }

      .inside-hero {
        min-height: 116px;
      }

      .inside-party img {
        width: min(76%, 205px);
        max-height: 110px;
      }

      .party-detail {
        min-height: 48px;
        padding-inline: 8px;
      }

      .location-block {
        padding: 7px 7px 8px;
      }

      .show-card {
        grid-template-columns: 41px 1fr 41px;
        gap: 2px;
        padding: 7px 5px;
      }

      .show-decor {
        width: 41px;
        height: 48px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cover,
      .map-button,
      .rsvp-button,
      .rsvp-submit,
      .rsvp-close,
      .open-button,
      .party-detail {
        transition: none;
      }

      .book-toggle:checked + .book .cover {
        opacity: 0;
        transform: none;
      }

      .celebration-burst span {
        animation: none !important;
        display: none;
      }
    }
  </style>
</head>

              <picture>
                <source srcset="assets/number-one-sticker.webp" type="image/webp">
                <img src="assets/number-one-sticker.png" alt="1">
              </picture>
              <span>añito</span>
            </div>
          </div>
          <div class="cover-panel">
            <div class="cover-note">¡No faltes!</div>
            <div class="cover-reminder">¡No olvides tu traje de baño!</div>
          </div>
        </label>
        <label class="close-flap" for="open-book" aria-label="Cerrar invitación desde el lado izquierdo"></label>

        <div class="sparkles" aria-hidden="true">
          <i></i><i></i><i></i><i></i>
        </div>
        <div class="celebration-burst" aria-hidden="true">
          <span class="balloon b1"></span>
          <span class="balloon b2"></span>
          <span class="balloon b3"></span>
          <span class="confetti c1"></span>
          <span class="confetti c2"></span>
          <span class="confetti c3"></span>
          <span class="confetti c4"></span>
          <span class="confetti c5"></span>
          <span class="confetti c6"></span>
          <span class="confetti c7"></span>
          <span class="confetti c8"></span>
        </div>
      </div>

      <label class="open-button" for="open-book">
        <span class="open-copy">Abrir invitación</span>
        <span class="close-copy">Cerrar invitación</span>
      </label>
    </section>
  </main>

  <div class="rsvp-modal" id="rsvp-modal" hidden>
    <form class="rsvp-dialog" id="rsvp-form">
      <h2>Confirmar asistencia</h2>
      <p id="rsvp-help">¿Cuántas personas asistirán?</p>
      <div class="guest-stepper" aria-label="Cantidad de personas">
        <button type="button" id="guest-minus" aria-label="Restar una persona">−</button>
        <input id="guest-count" name="guest-count" type="number" inputmode="numeric" min="1" max="30" value="1" aria-label="Cantidad de personas">
        <button type="button" id="guest-plus" aria-label="Agregar una persona">+</button>
      </div>
      <div class="rsvp-status" id="rsvp-status" aria-live="polite"></div>
      <div class="rsvp-actions">
        <button class="rsvp-close" type="button" id="close-rsvp">Cancelar</button>
        <button class="rsvp-submit" type="submit" id="submit-rsvp">Confirmar</button>
      </div>
    </form>
  </div>

  <script>
    (() => {
      const FORM_ACTION = "https://docs.google.com/forms/d/e/1FAIpQLScGEKlA4nqo_e5Za7KyvzYKyDH6N96LLU7QsIpd5PDBawi6Hw/formResponse";
      const PEOPLE_ENTRY = "entry.824094677";
      const CONFIRMATION_ENTRY = "entry.1714654851";
      const STORAGE_KEY = "ethanMateoRsvp";

      const modal = document.getElementById("rsvp-modal");
      const openButton = document.getElementById("open-rsvp");
      const closeButton = document.getElementById("close-rsvp");
      const form = document.getElementById("rsvp-form");
      const input = document.getElementById("guest-count");
      const minus = document.getElementById("guest-minus");
      const plus = document.getElementById("guest-plus");
      const status = document.getElementById("rsvp-status");
      const help = document.getElementById("rsvp-help");
      const submitButton = document.getElementById("submit-rsvp");

      const clampGuests = (value) => Math.min(30, Math.max(1, Number.parseInt(value, 10) || 1));

      const readSaved = () => {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        } catch {
          return null;
        }
      };

      const setDisabled = (disabled) => {
        input.disabled = disabled;
        minus.disabled = disabled;
        plus.disabled = disabled;
        submitButton.disabled = disabled;
      };

      const openModal = () => {
        const saved = readSaved();
        const alreadyConfirmed = Boolean(saved && saved.sent);

        modal.hidden = false;
        input.value = saved?.people || 1;
        setDisabled(alreadyConfirmed);
        help.textContent = alreadyConfirmed
          ? "Ya registramos una confirmación desde este teléfono."
          : "¿Cuántas personas asistirán?";
        status.textContent = alreadyConfirmed
          ? `Confirmación guardada: ${saved.people} persona${saved.people === 1 ? "" : "s"}.`
          : "Revisa bien el número antes de confirmar.";
        submitButton.textContent = alreadyConfirmed ? "Registrado" : "Confirmar";
        closeButton.textContent = alreadyConfirmed ? "Cerrar" : "Cancelar";
        setTimeout(() => (alreadyConfirmed ? closeButton : input).focus(), 0);
      };

      const closeModal = () => {
        modal.hidden = true;
        openButton.focus();
      };

      openButton.addEventListener("click", openModal);
      closeButton.addEventListener("click", closeModal);
      modal.addEventListener("click", (event) => {
        if (event.target === modal) closeModal();
      });

      document.addEventListener("keydown", (event) => {
        if (!modal.hidden && event.key === "Escape") closeModal();
      });

      minus.addEventListener("click", () => {
        input.value = clampGuests(input.value - 1);
      });

      plus.addEventListener("click", () => {
        input.value = clampGuests(Number(input.value) + 1);
      });

      input.addEventListener("input", () => {
        input.value = clampGuests(input.value);
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (readSaved()?.sent) {
          status.textContent = "Esta confirmación ya quedó registrada desde este teléfono.";
          return;
        }

        const people = clampGuests(input.value);
        input.value = people;
        setDisabled(true);
        closeButton.disabled = true;
        submitButton.textContent = "Enviando...";
        status.textContent = "Guardando confirmación...";

        const body = new URLSearchParams();
        body.set(PEOPLE_ENTRY, String(people));
        body.set(CONFIRMATION_ENTRY, "1");

        try {
          await fetch(FORM_ACTION, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body
          });

          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            sent: true,
            people,
            sentAt: new Date().toISOString()
          }));

          status.textContent = `¡Gracias! Registramos ${people} persona${people === 1 ? "" : "s"}.`;
          submitButton.textContent = "Registrado";
          setTimeout(closeModal, 1300);
        } catch {
          status.textContent = "No se pudo enviar. Revisa tu conexión e intenta de nuevo.";
          setDisabled(false);
          closeButton.disabled = false;
          submitButton.textContent = "Confirmar";
        }
      });
    })();
  </script>
</body>
</html>
